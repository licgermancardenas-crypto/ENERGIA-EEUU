[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eia-pulso"
version = "0.1.0"
description = "Pulso Energético de EE. UU. — pipeline medallón (Bronze/Silver/Gold) de petróleo y gas con la API de la EIA"
authors = [{ name = "Germán Cárdenas" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=1.0",
    "PyYAML>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6"]
# Capa geoespacial (mapa de la red de gasoductos): solo hace falta para `eia-pulso geo`
geo = ["geopandas>=1.0", "shapely>=2.0", "pyproj>=3.6", "pyogrio>=0.9", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Notebooks de Fabric: `spark`, `display` y `notebookutils` son globales del runtime;
# los imports van por celda (E402).
"fabric/notebooks/src/*.py" = ["F821", "E402", "E501"]
"fabric/notebooks/*.ipynb" = ["F821", "E402", "E501", "I001"]
