# Configuración del pipeline "Pulso Energético de EE. UU. — Petróleo y Gas"
# Todas las rutas y series fueron verificadas contra la API v2 de la EIA (2026-11-25).

api:
  base_url: https://api.eia.gov/v2
  tamanio_pagina: 5000        # máximo permitido por la EIA por llamada
  max_reintentos: 5
  backoff_base_s: 1.0         # espera = base * 2^intento (+ jitter)
  timeout_s: 60

rutas:
  data_dir: data              # relativo a la raíz del repo

silver:
  dias_minimos_diarios: 2     # series diarias: solo datos con al menos N días de antigüedad

# Ventana de relectura en días para la carga incremental (capta revisiones de la EIA)
ventana_relectura_dias:
  daily: 30
  weekly: 56
  monthly: 186

# Umbrales de frescura en días, medidos desde el FIN del período
umbrales_frescura_dias:
  daily: 10
  weekly: 14
  monthly: 120

rezago:
  max_meses: 12
  min_observaciones: 24
  precio: {dataset: precios_spot_mensuales, serie: RWTC}
  produccion: {dataset: produccion_crudo_mensual, serie: MCRFPUS2}
  escenarios:
    - {id: completo, etiqueta: Historia completa}
    - {id: sin_pandemia, etiqueta: "Sin 2020-2021 (pandemia)", excluir: ["2020-01", "2021-12"]}

regiones:
  NUS:   {nombre: Estados Unidos, tipo: pais}
  YCUOK: {nombre: "Cushing, Oklahoma", tipo: hub_precio}
  ZEU:   {nombre: Europa (Mar del Norte), tipo: hub_precio}
  RGC:   {nombre: "Henry Hub, Luisiana", tipo: hub_precio}
  R31:   {nombre: Este, tipo: region_almacenamiento}
  R32:   {nombre: Medio Oeste, tipo: region_almacenamiento}
  R33:   {nombre: Centro Sur, tipo: region_almacenamiento}
  R34:   {nombre: Montaña, tipo: region_almacenamiento}
  R35:   {nombre: Pacífico, tipo: region_almacenamiento}
  R48:   {nombre: Lower 48, tipo: agregado_almacenamiento}

datasets:
  precios_spot_diarios:
    ruta: petroleum/pri/spt
    frecuencia: daily
    inicio: "2023-01-01"
    sector: petroleo
    categoria: precio_spot
    tabla_gold: fact_precios_diarios
    series:
      RWTC: WTI (Cushing)
      RBRTE: Brent (Europa)

  henry_hub_diario:
    ruta: natural-gas/pri/fut
    frecuencia: daily
    inicio: "2023-01-01"
    sector: gas
    categoria: precio_spot
    tabla_gold: fact_precios_diarios
    series:
      RNGWHHD: Henry Hub

  precios_spot_mensuales:
    ruta: petroleum/pri/spt
    frecuencia: monthly
    inicio: "2010-01"
    sector: petroleo
    categoria: precio_spot_mensual
    tabla_gold: fact_precios_mensuales
    series:
      RWTC: WTI (Cushing) mensual
      RBRTE: Brent (Europa) mensual

  henry_hub_mensual:
    ruta: natural-gas/pri/fut
    frecuencia: monthly
    inicio: "2010-01"
    sector: gas
    categoria: precio_spot_mensual
    tabla_gold: fact_precios_mensuales
    series:
      RNGWHHD: Henry Hub mensual

  precio_surtidor_semanal:
    ruta: petroleum/pri/gnd
    frecuencia: weekly
    inicio: "2023-01-01"
    sector: petroleo
    categoria: precio_surtidor
    tabla_gold: fact_precio_surtidor_semanal
    series:
      EMM_EPMR_PTE_NUS_DPG: Gasolina regular
      EMM_EPMM_PTE_NUS_DPG: Gasolina media
      EMM_EPMP_PTE_NUS_DPG: Gasolina premium
      EMD_EPD2D_PTE_NUS_DPG: Diésel

  inventarios_semanales:
    ruta: petroleum/stoc/wstk
    frecuencia: weekly
    inicio: "2023-01-01"
    sector: petroleo
    categoria: inventario
    tabla_gold: fact_inventarios_semanales
    series:
      WCESTUS1: Crudo comercial (sin SPR)
      WCSSTUS1: Reserva Estratégica (SPR)
      WGTSTUS1: Gasolina total
      WDISTUS1: Destilados

  # Verificada en la API v2 el 2026-11-27: petroleum/pnp/wiup, serie WPULEUS3 (%), semanal.
  # Va a la misma tabla de hechos semanal de petróleo para no sumar una tabla nueva al modelo.
  utilizacion_refinerias_semanal:
    ruta: petroleum/pnp/wiup
    frecuencia: weekly
    inicio: "2015-01-01"
    sector: petroleo
    categoria: refinacion
    tabla_gold: fact_inventarios_semanales
    series:
      WPULEUS3: Utilización de refinerías

  produccion_crudo_mensual:
    ruta: petroleum/crd/crpdn
    frecuencia: monthly
    inicio: "2010-01"
    sector: petroleo
    categoria: produccion
    tabla_gold: fact_produccion_mensual
    series:
      MCRFPUS2: Producción de crudo

  almacenamiento_gas_semanal:
    ruta: natural-gas/stor/wkly
    frecuencia: weekly
    inicio: "2023-01-01"
    sector: gas
    categoria: almacenamiento
    tabla_gold: fact_almacenamiento_gas_semanal
    series:
      NW2_EPG0_SWO_R31_BCF: Almacenamiento Este
      NW2_EPG0_SWO_R32_BCF: Almacenamiento Medio Oeste
      NW2_EPG0_SWO_R33_BCF: Almacenamiento Centro Sur
      NW2_EPG0_SWO_R34_BCF: Almacenamiento Montaña
      NW2_EPG0_SWO_R35_BCF: Almacenamiento Pacífico
      NW2_EPG0_SWO_R48_BCF: Almacenamiento Lower 48

  consumo_gas_mensual:
    ruta: natural-gas/cons/sum
    frecuencia: monthly
    inicio: "2010-01"
    sector: gas
    categoria: consumo
    tabla_gold: fact_consumo_gas_mensual
    series:
      N3010US2: Residencial
      N3020US2: Comercial
      N3035US2: Industrial
      N3045US2: Generación eléctrica
      N3025US2: Vehicular
      N9140US2: Consumo total

  produccion_gas_mensual:
    ruta: natural-gas/prod/sum
    frecuencia: monthly
    inicio: "2010-01"
    sector: gas
    categoria: produccion
    tabla_gold: fact_produccion_mensual
    series:
      N9070US2: Producción de gas seco
      N9050US2: Producción de gas comercializada

# ---------------------------------------------------------------------------------------
# Capa geoespacial (páginas "Mapa de la red" y "Análisis geoespacial").
# Pipeline aparte de `datasets` para no alterar la frescura ni la web existentes; sigue la
# misma convención: Bronze (crudo + manifiesto) -> Silver (normalizado) -> Gold (métricas).
# Verificado el 2026-11-26. Los servicios oficiales de la EIA en ArcGIS ahora piden token,
# por eso las capas estáticas vienen de copias públicas de terceros (se rotulan así).
geo:
  crs_calculo: 5070            # NAD83 / Conus Albers (área equivalente): km y km²
  crs_visual: 4326             # WGS84 para mostrar
  tolerancia_simplificacion_m: 1500   # Douglas-Peucker sobre EPSG:5070 (ver docs/geoespacial.md)
  decimales_coordenadas: 3     # ~100 m en WGS84: alcanza para un mapa de país
  umbral_proximidad_km: 25     # ver docs/geoespacial.md (laterales típicos de centrales)
  estados_excluidos: [PR]   # albersUsa no tiene recuadro para Puerto Rico (nota visible)
  umbral_dependencia_gas_red: 0.5   # hogares que calefaccionan con gas de red (ACS)
  capas:
    gasoductos:
      tipo: lineas
      url: https://services2.arcgis.com/vHeD2bHG1G3sW5YZ/ArcGIS/rest/services/NaturalGas_InterIntrastate_Pipelines_US_EIA_ExportFeatures/FeatureServer/0
      origen: "EIA, Natural Gas Interstate and Intrastate Pipelines (copia pública de terceros en ArcGIS Online)"
      vintage: "2020-01"       # la descripción de la EIA dice "updated January 2020"
    hubs:
      tipo: puntos
      url: https://services.arcgis.com/jDGuO8tYggdCCnUJ/arcgis/rest/services/Natural_Gas_Market_Hubs/FeatureServer/0
      origen: "EIA, Natural Gas Market Hubs (copia pública de terceros en ArcGIS Online)"
      vintage: "2020-02"       # campo Period = 202002
    gnl:
      tipo: puntos
      url: https://services.arcgis.com/kbDdtKcFi2adamXa/arcgis/rest/services/Lng_ImportExportTerminals_US_EIA/FeatureServer/0
      origen: "EIA, LNG Import/Export Terminals (copia pública de terceros en ArcGIS Online)"
      vintage: "2023-08"       # campo Period = "As of August 2023"
    reserva_estrategica:
      tipo: puntos
      url: https://services.arcgis.com/jDGuO8tYggdCCnUJ/arcgis/rest/services/Strategic_Petroleum_Reserves/FeatureServer/0
      origen: "DOE Office of Petroleum Reserves vía EIA (copia pública de terceros en ArcGIS Online)"
      vintage: "2022-04"       # campo Period = "As of April 6, 2022"
    regiones_almacenamiento:
      tipo: poligonos
      url: https://services7.arcgis.com/FGr1D95XCGALKXqM/ArcGIS/rest/services/Natural_Gas_Storage_Regions/FeatureServer/0
      origen: "EIA, Natural Gas Storage Regions (servicio oficial de la EIA)"
      vintage: "2020-10"
    estados:
      tipo: poligonos
      archivo: data/geo/entrada/census/cb_2024_us_state_20m.zip
      url: https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_us_state_20m.zip
      origen: "U.S. Census Bureau, Cartographic Boundary Files 2024 (1:20.000.000)"
      vintage: "2024"
    condados:
      tipo: poligonos
      archivo: data/geo/entrada/census/cb_2024_us_county_5m.zip
      url: https://www2.census.gov/geo/tiger/GENZ2024/shp/cb_2024_us_county_5m.zip
      origen: "U.S. Census Bureau, Cartographic Boundary Files 2024 (1:5.000.000)"
      vintage: "2024"
  flujos:
    ruta: natural-gas/move/ist   # International & Interstate Movements of Natural Gas by State
    frecuencia: annual
    inicio: "2015"
    procesos: {MIR: recibe, MID: entrega, MIN: neto}
  centrales:
    ruta: electricity/operating-generator-capacity   # Inventario de generadores (EIA-860M)
    frecuencia: monthly
    combustibles: [NG]           # energy_source_code: gas natural
  acs:
    # House Heating Fuel por condado (ACS 5 años 2020-2024; la de 2025 aún no salió).
    # La API del Census ahora pide key: se usa el Summary File oficial por tabla (sin key),
    # filtrando las filas de condados (GEO_ID 0500000US + FIPS de 5 dígitos).
    url: https://www2.census.gov/programs-surveys/acs/summary_file/2024/table-based-SF/data/5YRData/acsdt5y2024-b25040.dat
    tabla: B25040
    anio: "2020-2024"
    columnas: {B25040_E001: hogares, B25040_M001: hogares_moe, B25040_E002: gas_red,
               B25040_M002: gas_red_moe, B25040_E003: propano, B25040_M003: propano_moe}
  henry_hub:
    fuente_conexiones: "Sabine Pipe Line LLC, About Sabine Pipe Line (https://sabinepipeline.enlink.com/?p=25), consultado el 2026-11-26: 9 interestatales y 3 intraestatales"
